<script>
        window.onload = function() {
            let activeUser = localStorage.getItem("activeUser");
            if (activeUser) {
                showDashboard(activeUser);
            }
        };

        function switchTab(tabName) {
            if (tabName === 'signup') {
                document.getElementById("signupFlow").classList.remove("hidden");
                document.getElementById("signinFlow").classList.add("hidden");
                document.getElementById("signupTabBtn").classList.add("active");
                document.getElementById("signinTabBtn").classList.remove("active");
            } else {
                document.getElementById("signupFlow").classList.add("hidden");
                document.getElementById("signinFlow").classList.remove("hidden");
                document.getElementById("signupTabBtn").classList.remove("active");
                document.getElementById("signinTabBtn").classList.add("active");
            }
        }

        function sendOTP() {
            try {
                let targetEmail = document.getElementById("userEmail").value.trim();
                if (!targetEmail) {
                    alert("Meherbani karke pehle apni valid Gmail likhein!");
                    return;
                }

                let generatedOtpCode = Math.floor(100000 + Math.random() * 900000).toString();
                
                // sessionStorage ki jagah localStorage use kiya taake refresh hone par data na ude
                localStorage.setItem("targetEmail", targetEmail);
                localStorage.setItem("generatedOtp", generatedOtpCode);

                var templateParams = {
                    to_email: targetEmail,
                    email: targetEmail,
                    otp: generatedOtpCode
                };

                emailjs.send('service_dm0kmzg', 'template_jxznfzg', templateParams)
                    .then(function(response) {
                        alert("OTP code aapki Gmail (" + targetEmail + ") par bhej diya gaya hai!");
                        document.getElementById("step1_Email").classList.add("hidden");
                        document.getElementById("step2_OTP").classList.remove("hidden");
                    }, function(error) {
                        console.log('FAILED...', error);
                        alert("EmailJS Error: " + JSON.stringify(error));
                    });
            } catch (err) {
                alert("JS Error: " + err.message);
            }
        }

        function verifyOTP() {
            let userEnteredOtp = document.getElementById("enteredOtp").value.trim();
            let savedOtp = localStorage.getItem("generatedOtp");

            if (userEnteredOtp === savedOtp) {
                alert("OTP Kamyabi se verify ho gaya hai! Ab apna password set karein.");
                document.getElementById("step2_OTP").classList.add("hidden");
                document.getElementById("step3_Password").classList.remove("hidden");
            } else {
                alert("Ghalat OTP code! Meherbani karke sahi code enter karein.");
            }
        }

        function completeAccountSetup() {
            let pass = document.getElementById("newPassword").value;
            let confirmPass = document.getElementById("confirmPassword").value;
            let targetEmail = localStorage.getItem("targetEmail");

            if (!pass || !confirmPass) {
                alert("Meherbani karke dono password fields ko pur karein!");
                return;
            }

            if (pass !== confirmPass) {
                alert("Dono passwords aapas mein match nahi kar rahe!");
                return;
            }

            let playerCode = "ASH-" + Math.floor(1000 + Math.random() * 9000);
            
            localStorage.setItem("user_" + targetEmail, pass);
            localStorage.setItem("code_" + targetEmail, playerCode);
            localStorage.setItem("email_by_code_" + playerCode, targetEmail);
            localStorage.setItem("activeUser", targetEmail);
            
            // Temporary setup data clear kar dein
            localStorage.removeItem("targetEmail");
            localStorage.removeItem("generatedOtp");

            alert("Mubarak ho! Aapka account mukammal ban chuka hai.");
            showDashboard(targetEmail);
        }

        function handleLogin() {
            let emailInput = document.getElementById("loginEmail").value.trim();
            let passInput = document.getElementById("loginPassword").value;

            let savedPassword = localStorage.getItem("user_" + emailInput);

            if (savedPassword && savedPassword === passInput) {
                localStorage.setItem("activeUser", emailInput);
                showDashboard(emailInput);
            } else {
                alert("Ghalat Email ya Password! Meherbani karke dobara koshish karein.");
            }
        }

        function showDashboard(email) {
            document.getElementById("authMainContainer").classList.add("hidden");
            document.getElementById("appDashboard").classList.remove("hidden");
            document.getElementById("bottomNav").classList.remove("hidden");
            document.getElementById("userEmailDisplay").innerText = email;
            document.getElementById("accEmailText").innerText = email;

            let pCode = localStorage.getItem("code_" + email);
            if (!pCode) {
                pCode = "ASH-" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem("code_" + email, pCode);
                localStorage.setItem("email_by_code_" + pCode, email);
            }
            document.getElementById("accPlayerCode").innerText = pCode;

            let feedBtn = document.querySelector(".bottom-nav .nav-item");
            switchAppTab('feed', feedBtn);
        }

        function searchPlayer() {
            let codeQuery = document.getElementById("searchPlayerInput").value.trim().toUpperCase();
            let resultBox = document.getElementById("searchResultBox");

            if (!codeQuery) {
                resultBox.innerText = "Please enter a player code.";
                return;
            }

            let foundEmail = localStorage.getItem("email_by_code_" + codeQuery);
            if (foundEmail) {
                resultBox.style.color = "#28a745";
                resultBox.innerText = "Found Player: " + foundEmail;
            } else {
                resultBox.style.color = "#dc3545";
                resultBox.innerText = "No player found with this code!";
            }
        }

        function switchAppTab(tabId, btnElement) {
            let panes = document.querySelectorAll(".tab-pane");
            panes.forEach(pane => pane.classList.add("hidden"));

            document.getElementById("tabContent_" + tabId).classList.remove("hidden");

            let navItems = document.querySelectorAll(".nav-item");
            navItems.forEach(item => item.classList.remove("active"));
            if (btnElement) {
                btnElement.classList.add("active");
            }
        }

        function handleLogout() {
            localStorage.removeItem("activeUser");
            location.reload();
        }
    </script>
