<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashiana Cricket - App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding-bottom: 70px;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 380px;
            margin: 40px auto;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ccc;
        }
        .tab-buttons button {
            flex: 1;
            padding: 10px;
            background: none;
            color: #555;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-buttons button.active {
            color: #28a745;
            border-bottom: 3px solid #28a745;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover {
            background-color: #218838;
        }
        .hidden {
            display: none !important;
        }

        /* App Dashboard & Feed Styles */
        #appDashboard {
            max-width: 450px;
            margin: 0 auto;
            padding: 0;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: bold;
            font-size: 18px;
            color: #111;
        }
        .header-icons {
            display: flex;
            gap: 15px;
            font-size: 18px;
            cursor: pointer;
        }
        .feed-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .match-live-tag {
            color: #d9534f;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            margin: 8px 0;
        }
        .score {
            color: #333;
        }
