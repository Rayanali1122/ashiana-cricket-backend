<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashiana Cricket - Signup & OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 380px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        .hidden {
            display: none !important;
        }
    </style>

    <!-- EmailJS SDK CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("WCD-b49eWdbygyZ7"); // Aapki EmailJS Public Key[span_1](start_span)[span_1](end_span)
        })();
    </script>
</head>
<body>

    <div class="container">
        <h2>Ashiana Cricket Register</h2>
        
        <!-- Step 1: Signup Form -->
        <div id="signupSection">
            <div class="form-group">
                <label>Apni Gmail Likhein:</label>
                <input type="email" id="userEmail" placeholder="example@gmail.com" required>
            </div>
            <button type="button" onclick="sendOTP()">Send OTP</button>
        </div>

        <!-- Step 2: OTP Verification Box -->
        <div id="otpSection" class="hidden">
            <div class="form-group">
                <label>OTP Code Darj Karein:</label>
                <input type="text" id="enteredOtp" placeholder="Enter 6-digit OTP">
            </div>
            <button type="button" onclick="verifyOTP()">Verify OTP & Open Account</button>
        </div>
    </div>

    <script>
        let generatedOtpCode = "";
        let targetEmail = "";

        function sendOTP() {
            try {
                targetEmail = document.getElementById("userEmail").value.trim();
                if (!targetEmail) {
                    alert("Meherbani karke pehle apni valid Gmail likhein!");
                    return;
                }

                // 6 digit random OTP generate karna
                generatedOtpCode = Math.floor(100000 + Math.random() * 900000).toString();

                var templateParams = {
                    to_email: targetEmail,
                    otp: generatedOtpCode
                };

                alert("Email bheji ja rahi hai, thoda intezaar karein...");

                // EmailJS ke zariye email bhejna
                emailjs.send('service_dm0kmzg', 'template_jxznfzg', templateParams)
                    .then(function(response) {
                        alert("OTP code aapki Gmail (" + targetEmail + ") par bhej diya gaya hai!");
                        document.getElementById("signupSection").classList.add("hidden");
                        document.getElementById("otpSection").classList.remove("hidden");
                    }, function(error) {
                        console.log('FAILED...', error);
                        alert("EmailJS Error: " + JSON.stringify(error));
                    });
            } catch (err) {
                alert("JS Error: " + err.message);
            }
        }

        function verifyOTP() {
            let userEnteredOtp = document.getElementById("enteredOtp").value.trim();

            if (userEnteredOtp === generatedOtpCode) {
                alert("Mubarak ho! Account kamyabi se open ho gaya hai.");
            } else {
                alert("Ghalat OTP code! Meherbani karke sahi code enter karein.");
            }
        }
    </script>

</body>
</html>
