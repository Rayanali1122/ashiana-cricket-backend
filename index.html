<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashiana Cricket - App</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding-bottom: 90px;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 380px;
            margin: 40px auto;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ccc;
        }
        .tab-buttons button {
            flex: 1;
            padding: 10px;
            background: none;
            color: #555;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-buttons button.active {
            color: #28a745;
            border-bottom: 3px solid #28a745;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover {
            background-color: #218838;
        }
        .hidden {
            display: none !important;
        }

        /* Dashboard Styles */
        #appDashboard {
            max-width: 450px;
            margin: 0 auto;
            padding: 15px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: bold;
            font-size: 18px;
            color: #111;
        }
        .feed-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Floating Bottom Bar */
        .bottom-nav-container {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
        }
        .bottom-nav {
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 92%;
            max-width: 420px;
            padding: 10px 5px;
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .nav-item {
            text-align: center;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item.active {
            color: #a94442;
            font-weight: bold;
        }
        .nav-item .icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .account-info-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            text-align: left;
        }
        .account-info-box label {
            font-size: 12px;
            color: #888;
            margin-bottom: 2px;
        }
        .account-info-box p {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
    </style>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("WCD-b496wqtbygcZ7");
        })();
    </script>
</head>
<body>

    <!-- Auth Container -->
    <div class="container" id="authMainContainer">
        <div id="authContainer">
            <h2>Ashiana Cricket</h2>

            <div class="tab-buttons" id="tabButtons">
                <button type="button" id="signupTabBtn" class="active" onclick="switchTab('signup')">Sign Up</button>
                <button type="button" id="signinTabBtn" onclick="switchTab('signin')">Sign In</button>
            </div>

            <!-- SIGN UP FLOW -->
            <div id="signupFlow">
                <div id="step1_Email">
                    <div class="form-group">
                        <label>Apni Gmail Likhein:</label>
                        <input type="email" id="userEmail" placeholder="example@gmail.com" required>
                    </div>
                    <button type="button" class="btn" onclick="sendOTP()">Send OTP</button>
                </div>

                <div id="step2_OTP" class="hidden">
                    <div class="form-group">
                        <label>Gmail par aaya 6-hinsoun ka OTP darj karein:</label>
                        <input type="text" id="enteredOtp" placeholder="Enter 6-digit OTP" maxlength="6">
                    </div>
                    <button type="button" class="btn" onclick="verifyOTP()">Verify OTP</button>
                </div>

                <div id="step3_Password" class="hidden">
                    <div class="form-group">
                        <label>Naya Password Set Karein:</label>
                        <input type="password" id="newPassword" placeholder="Enter Password" required>
                    </div>
